<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenic — Product Details</title><link rel="icon" href="/img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<div id="loader"><img src="/img/logo.png" alt="Agenic"></div>
<div class="ph"><div class="wrap"><div class="bar"><a href="/"><img src="/img/logo.png" alt="Agenic"></a><div class="verified">✔ Genuine Agenic Product</div></div></div></div>
<main class="wrap pmain" id="root"></main>
<div class="wrap more center"><a class="btn ghost" href="/#products">Explore more Agenic products →</a></div>
<footer><div class="wrap"><div class="fg"><div><img src="/img/logo.png" alt="Agenic"><p style="margin-top:14px">Quality You Trust. Goodness You Deserve.</p></div><div><b style="color:#fff">Agenic Agritech India Pvt Ltd</b><p>No. 58, 4th Street, Annai Nagar,<br>Korattur, Chennai – 600076</p></div></div><small>© <span id="yr"></span> Agenic Agritech India Private Limited</small></div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('yr').textContent=new Date().getFullYear();
const id=location.pathname.split('/').pop();
fetch('/api/products/'+encodeURIComponent(id)).then(r=>{if(!r.ok)throw 0;return r.json()}).then(p=>{
 document.title=p.name+' — Agenic';
 const v=p.vendor;
 const kv=[['Pack sizes',p.pack],['Shelf life',p.shelfLife],['MRP',p.mrp&&('₹ '+p.mrp)],['FSSAI',p.fssai||v?.fssai],['Batch / Note',p.batchNote]].filter(x=>x[1]);
 document.getElementById('root').innerHTML=`
 <section class="hcard">
  <div class="pv">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:`<span class="em">${esc(p.emoji)}</span>`}</div>
  <div><span class="tag">${esc(p.category)}</span><h1>${esc(p.name)}</h1><p style="color:var(--g6);font-weight:700">${esc(p.tagline)}</p>
   <p style="margin-top:12px;color:var(--mut)">${esc(p.description)}</p>
   <div class="hl">${p.highlights.map(h=>`<span>✓ ${esc(h)}</span>`).join('')}</div>
   <div class="kv">${kv.map(([k,val])=>`<div><small>${k}</small><b>${esc(val)}</b></div>`).join('')}</div>
  </div>
 </section>
 <div class="blocks">
  ${p.ingredients?`<div class="blk"><h3>🌾 Ingredients</h3><p style="color:var(--mut)">${esc(p.ingredients)}</p></div>`:''}
  ${p.storage?`<div class="blk"><h3>❄️ Storage</h3><p style="color:var(--mut)">${esc(p.storage)}</p></div>`:''}
  ${p.howToUse.length?`<div class="blk"><h3>👩‍🍳 How to use</h3><ol>${p.howToUse.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`:''}
 </div>
 ${v?`<section class="vendor"><div class="av">${esc(v.name[0])}</div><div>
   <small style="letter-spacing:.15em;font-weight:800;color:var(--lime2)">MADE &amp; SUPPLIED BY</small>
   <h3>${esc(v.name)}</h3>${v.about?`<p>${esc(v.about)}</p>`:''}
   <div class="row">${v.established?`<span>🏭 Est. ${esc(v.established)}</span>`:''}${v.fssai?`<span>🛡️ FSSAI ${esc(v.fssai)}</span>`:''}${v.address?`<span>📍 ${esc(v.address)}</span>`:''}${v.phone?`<span>📞 ${esc(v.phone)}</span>`:''}${v.email?`<span>✉️ ${esc(v.email)}</span>`:''}</div>
 </div></section>`:''}
 <div class="actions">
  <button class="btn pri" id="sh">📤 Share</button>
  ${v?.phone?`<a class="btn lime" href="tel:${esc(v.phone)}">📞 Call</a>`:''}
  ${v?.address?`<a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.address)}">🧭 Directions</a>`:''}
 </div>`;
 document.getElementById('sh').onclick=()=>navigator.share?navigator.share({title:p.name,url:location.href}):(navigator.clipboard.writeText(location.href),alert('Link copied!'));
}).catch(()=>{document.getElementById('root').innerHTML='<div class="hcard" style="display:block;text-align:center"><h1>Product not found</h1><p style="margin:12px 0 22px;color:var(--mut)">This QR code may be outdated.</p><a class="btn pri" href="/">Go to Agenic home</a></div>'})
.finally(()=>setTimeout(()=>document.getElementById('loader').classList.add('hide'),500));
</script></body></html>
