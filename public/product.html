<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenic | Product details</title><link rel="icon" href="/img/logo.png"><meta name="theme-color" content="#0a4a18">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<div id="loader"><div class="in"><img src="/img/logo.png" alt="Agenic"><div class="bar"><i></i></div></div></div>
<div class="pt"><div class="wrap"><a href="/"><img src="/img/logo.png" alt="Agenic Agritech India"></a><span class="ver"><svg class="i"><use href="#i-shield"/></svg>Genuine Agenic product</span></div></div>
<main class="wrap" id="root"></main>
<footer style="margin-top:80px;padding-bottom:110px"><div class="wrap"><div class="fg" style="grid-template-columns:1.4fr 1fr"><div><span class="plate"><img src="/img/logo.png" alt="Agenic"></span><p style="margin-top:20px">Quality You Trust. Goodness You Deserve.</p></div><div><h5>Agenic Agritech India Pvt Ltd</h5><p>No. 58, 4th Street, Annai Nagar,<br>Korattur, Chennai &ndash; 600076</p><a href="/" style="margin-top:12px">Visit our website</a></div></div><div class="cp"><span>&copy; <span id="yr"></span> Agenic Agritech India Private Limited</span></div></div></footer>
<script src="/js/icons.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#yr').textContent=new Date().getFullYear();
const id=location.pathname.split('/').pop();
const ini=n=>String(n).split(/\s+/).filter(w=>/^[A-Za-z0-9]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('');
fetch('/api/products/'+encodeURIComponent(id)).then(r=>{if(!r.ok)throw 0;return r.json()}).then(p=>{
 document.title=p.name+' | Agenic';const v=p.vendor;
 const spec=[['Pack sizes',p.pack],['Shelf life',p.shelfLife],['MRP',p.mrp&&('Rs. '+p.mrp)],['FSSAI licence',p.fssai||v?.fssai],['Batch / note',p.batchNote],['Category',p.category]].filter(x=>x[1]);
 $('#root').innerHTML=`
 <div class="crumb"><a href="/">Home</a> &nbsp;/&nbsp; <a href="/#products">Products</a> &nbsp;/&nbsp; ${esc(p.name)}</div>
 <section class="phero">
  <div class="pvis rv sc">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:`<div class="mono">${esc(ini(p.name))}</div>`}<div class="stamp">${ic('shield')}<div>Authentic listing<br><span style="font-weight:500;color:var(--mut)">Agenic Agritech India</span></div></div></div>
  <div class="pinfo rv" style="--d:2"><div class="eyebrow">${esc(p.category)}</div><h1>${esc(p.name)}</h1>${p.tagline?`<div class="tg">${esc(p.tagline)}</div>`:''}<p class="ds">${esc(p.description)}</p>
   <div class="chips">${(p.highlights||[]).map(h=>`<span>${ic('check')}${esc(h)}</span>`).join('')}</div>
   <div class="spec">${spec.map(([k,val])=>`<div><small>${k}</small><b>${esc(val)}</b></div>`).join('')}</div></div>
 </section>
 <div class="det">
  ${p.ingredients?`<div class="dc rv"><h3>${ic('leaf')}Ingredients</h3><p>${esc(p.ingredients)}</p></div>`:''}
  ${p.storage?`<div class="dc rv" style="--d:1"><h3>${ic('thermo')}Storage &amp; handling</h3><p>${esc(p.storage)}</p></div>`:''}
  ${(p.howToUse||[]).length?`<div class="dc rv" style="--d:2"><h3>${ic('utensils')}How to use</h3><ol>${p.howToUse.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`:''}
 </div>
 ${v?`<section class="vend rv"><div class="av ${v.logo?'lg':''}">${v.logo?`<img src="${esc(v.logo)}" alt="${esc(v.name)} logo">`:esc(v.name[0])}</div><div><small>Manufactured &amp; supplied by</small><h3>${esc(v.name)}</h3>${v.about?`<p>${esc(v.about)}</p>`:''}
  <div class="info">${v.address?`<div>${ic('pin')}<span><b>Address</b>${esc(v.address)}</span></div>`:''}${v.fssai?`<div>${ic('shield')}<span><b>FSSAI licence</b>${esc(v.fssai)}</span></div>`:''}${v.established?`<div>${ic('factory')}<span><b>Established</b>${esc(v.established)}</span></div>`:''}${v.incorporated?`<div>${ic('building')}<span><b>Incorporated</b>${esc(v.incorporated)}</span></div>`:''}${v.phone?`<div>${ic('phone')}<span><b>Phone</b>${esc(v.phone)}</span></div>`:''}${v.email?`<div>${ic('mail')}<span><b>Email</b>${esc(v.email)}</span></div>`:''}</div></div></section>`:''}
 <div class="trust rv"><div>${ic('shield')}<span><b>FSSAI licensed</b>Compliant food production</span></div><div>${ic('scan')}<span><b>QR traceable</b>Scan any Agenic pack</span></div><div>${ic('award')}<span><b>Quality assured</b>Checked before dispatch</span></div></div>
 <div class="dock"><button class="btn lime sm" id="sh">${ic('share')}<span>Share</span></button>${v?.phone?`<a class="btn ghost sm" href="tel:${esc(v.phone)}">${ic('phone')}<span>Call</span></a>`:''}${v?.address?`<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.address)}">${ic('nav')}<span>Directions</span></a>`:''}<a class="btn ghost sm" href="/#contact"><span>Enquire</span></a></div>`;
 $('#sh').onclick=()=>navigator.share?navigator.share({title:p.name,url:location.href}):(navigator.clipboard.writeText(location.href),$('#sh span').textContent='Link copied');
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll('.rv').forEach(el=>io.observe(el));
}).catch(()=>{$('#root').innerHTML='<section style="text-align:center;padding:140px 0"><h1 style="font-size:48px;color:var(--g9)">Product not found</h1><p style="margin:14px 0 30px;color:var(--mut)">This QR code may be outdated.</p><a class="btn pri" href="/"><span>Go to Agenic home</span></a></section>'})
.finally(()=>setTimeout(()=>$('#loader').classList.add('hide'),700));
</script></body></html>
