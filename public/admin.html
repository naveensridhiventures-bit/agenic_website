<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Agenic Admin</title><link rel="icon" href="/img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
body{background:#eef5e6}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,var(--g9),var(--g6));padding:20px}
.lbox{background:#fff;border-radius:30px;padding:40px;width:100%;max-width:400px;text-align:center;box-shadow:0 40px 80px -20px rgba(0,0,0,.5)}
.lbox img{height:70px;margin:0 auto 18px}
input,textarea,select{width:100%;padding:12px 14px;border:2px solid #dbe8cf;border-radius:14px;font:inherit;background:#fff;outline:0;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--g6)}
label{display:block;font-size:13px;font-weight:700;color:var(--g8);margin:14px 0 6px}
.top2{background:#fff;box-shadow:0 4px 20px -10px rgba(0,0,0,.2);position:sticky;top:0;z-index:10}
.top2 .wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;gap:10px;flex-wrap:wrap}
.top2 img{height:42px}
.tabs{display:flex;gap:6px;background:#eef5e6;padding:5px;border-radius:999px}
.tabs button{border:0;background:none;padding:9px 20px;border-radius:999px;font:700 14px inherit;font-family:inherit;cursor:pointer;color:var(--g8)}
.tabs button.on{background:var(--g7);color:#fff}
.head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 20px;flex-wrap:wrap;gap:12px}
.head h2{color:var(--g8);font-size:30px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.it{background:#fff;border-radius:22px;padding:22px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.it h3{color:var(--g8);font-size:20px}.it small{color:var(--mut)}
.it .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sm{padding:8px 16px;font-size:13px}
.danger{background:#fee;color:#b00;border:0}
.modal{position:fixed;inset:0;background:rgba(7,61,18,.6);backdrop-filter:blur(4px);z-index:100;display:none;place-items:start center;overflow:auto;padding:30px 16px}
.modal.on{display:grid}
.mb{background:#fff;border-radius:28px;padding:30px;width:100%;max-width:680px;animation:up .4s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.two{grid-template-columns:1fr}}
.qrb{text-align:center}.qrb img{width:260px;margin:14px auto;border-radius:18px;border:1px solid #dbe8cf}
.qrb code{display:block;background:#eef5e6;padding:10px;border-radius:10px;font-size:12px;word-break:break-all}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--g8);color:#fff;padding:12px 24px;border-radius:999px;z-index:300;font-weight:700;display:none}
</style></head><body>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token=sessionStorage.getItem('at'),db={products:[],vendors:[]},enq=[],tab='products';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)};
const api=async(u,o={})=>{const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:o.body&&JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));if(r.status===401&&token){sessionStorage.removeItem('at');token=null;render();}if(!r.ok)throw new Error(j.error||'Error');return j};
function login(){ $('#app').innerHTML=`<div class="login"><form class="lbox" id="lf"><img src="/img/logo.png" alt=""><h2 style="color:var(--g8)">Admin Login</h2><p style="color:var(--mut);margin:6px 0 18px;font-size:14px">Authorised personnel only</p><input type="password" id="pw" placeholder="Password" autofocus><button class="btn pri" style="width:100%;justify-content:center;margin-top:16px">Sign in</button></form></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});const j=await r.json();if(!r.ok)throw new Error(j.error);token=j.token;sessionStorage.setItem('at',token);load()}catch(er){toast(er.message)}}}
async function load(){try{db=await api('/api/admin/data');enq=await api('/api/admin/enquiries').catch(()=>[]);render()}catch{render()}}
function render(){ if(!token)return login();
 $('#app').innerHTML=`<div class="top2"><div class="wrap"><img src="/img/logo.png" alt=""><div class="tabs"><button data-t="products" class="${tab=='products'?'on':''}">Products</button><button data-t="vendors" class="${tab=='vendors'?'on':''}">Vendors</button><button data-t="enq" class="${tab=='enq'?'on':''}">Enquiries</button></div><div><a class="btn ghost sm" href="/" target="_blank">View site</a> <button class="btn ghost sm" id="lo">Logout</button></div></div></div>
 <div class="wrap" style="padding-bottom:60px">${tab=='products'?prodView():tab=='vendors'?vendView():enqView()}</div><div class="modal" id="modal"></div>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 $('#lo').onclick=()=>{sessionStorage.removeItem('at');token=null;render()};
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i));
}
const vname=id=>db.vendors.find(v=>v.id==id)?.name||'—';
const prodView=()=>`<div class="head"><h2>Products (${db.products.length})</h2><button class="btn pri" data-a="newp">+ Add product</button></div><div class="grid2">${db.products.map(p=>`<div class="it">${p.image?`<img src="${esc(p.image)}" style="height:64px;width:64px;object-fit:cover;border-radius:14px">`:`<div style="width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#eef6dc,#cfe8a0);display:grid;place-items:center;font:italic 500 26px Fraunces,serif;color:var(--g8)">${esc(p.name.split(/\s+/).filter(w=>/^[A-Za-z0-9]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join(''))}</div>`}<h3>${esc(p.name)}</h3><small>${esc(p.category)} · Vendor: ${esc(vname(p.vendorId))}</small><div class="row"><button class="btn pri sm" data-a="qr" data-i="${p.id}">QR code</button><button class="btn ghost sm" data-a="editp" data-i="${p.id}">Edit</button><a class="btn ghost sm" target="_blank" href="/p/${p.id}">Open</a><button class="btn danger sm" data-a="delp" data-i="${p.id}">Delete</button></div></div>`).join('')||'<p>No products yet.</p>'}</div>`;
const enqView=()=>`<div class="head"><h2>Enquiries (${enq.length})</h2></div><div class="grid2">${enq.map(e=>`<div class="it"><h3>${esc(e.name)}</h3><small>${esc(e.type)} &middot; ${esc(e.org)||'—'}</small><p style="margin:8px 0;font-size:14px">${esc(e.message)}</p><small>${esc(e.phone)} ${e.email?'&middot; '+esc(e.email):''}</small><small>${new Date(e.at).toLocaleString()}</small><div class="row"><a class="btn ghost sm" href="tel:${esc(e.phone)}">Call</a>${e.email?`<a class="btn ghost sm" href="mailto:${esc(e.email)}">Email</a>`:''}</div></div>`).join('')||'<p>No enquiries yet.</p>'}</div>`;
const vendView=()=>`<div class="head"><h2>Vendors (${db.vendors.length})</h2><button class="btn pri" data-a="newv">+ Add vendor</button></div><div class="grid2">${db.vendors.map(v=>`<div class="it"><h3>${esc(v.name)}</h3><small>${esc(v.address)}</small><small>FSSAI: ${esc(v.fssai)||'—'} · Est. ${esc(v.established)||'—'}</small><div class="row"><button class="btn ghost sm" data-a="editv" data-i="${v.id}">Edit</button><button class="btn danger sm" data-a="delv" data-i="${v.id}">Delete</button></div></div>`).join('')}</div>`;
const modal=h=>{const m=$('#modal');m.innerHTML=`<div class="mb">${h}</div>`;m.classList.add('on');m.onclick=e=>{if(e.target==m)m.classList.remove('on')}};
const close=()=>$('#modal').classList.remove('on');
const f=(id,l,v='',t='input',ph='')=>`<label>${l}</label>${t=='textarea'?`<textarea id="${id}" rows="3" placeholder="${ph}">${esc(v)}</textarea>`:`<input id="${id}" value="${esc(v)}" placeholder="${ph}">`}`;
async function act(a,i){
 if(a=='qr'){const u=(await fetch('/api/qr-url/'+i).then(r=>r.json())).url;modal(`<div class="qrb"><h2 style="color:var(--g8)">QR Code</h2><p style="color:var(--mut);font-size:14px">Print this on the product pack. Customers who scan it see the product page.</p><img src="/api/qr/${i}.png?${Date.now()}"><code>${esc(u)}</code><div class="row" style="justify-content:center;display:flex;gap:10px;margin-top:16px"><a class="btn pri sm" href="/api/qr/${i}.png?download=1">Download PNG</a><a class="btn ghost sm" href="/api/qr/${i}.svg" download="agenic-${i}-qr.svg">Download SVG</a><button class="btn ghost sm" onclick="close()">Close</button></div>${u.includes('localhost')?'<p style="color:#b66;font-size:12px;margin-top:12px">This is a local address. Deploy the site online first, then print the QR.</p>':''}</div>`);window.close=close;return}
 if(a=='delp'||a=='delv'){if(!confirm('Delete this item?'))return;try{await api('/api/admin/'+(a=='delp'?'products/':'vendors/')+i,{method:'DELETE'});toast('Deleted');load()}catch(e){toast(e.message)}return}
 if(a=='newp'||a=='editp'){const p=db.products.find(x=>x.id==i)||{highlights:[],howToUse:[],vendorId:db.vendors[0]?.id};
  modal(`<h2 style="color:var(--g8)">${i?'Edit':'Add'} product</h2>
  <div class="two">${f('n','Product name *',p.name)}${f('c','Category',p.category,'input','Batters, Spices, Snacks…')}</div>
  ${f('tg','Tagline',p.tagline)}${f('d','Description',p.description,'textarea')}
  <div class="two"><div><label>Vendor</label><select id="v">${db.vendors.map(v=>`<option value="${v.id}" ${v.id==p.vendorId?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div></div></div>
  <label>Product photo (optional)</label><input type="file" id="img" accept="image/png,image/jpeg,image/webp">${p.image?`<label style="font-weight:600"><input type="checkbox" id="ri" style="width:auto"> Remove current photo</label>`:''}
  ${f('h','Highlights (one per line)',(p.highlights||[]).join('\n'),'textarea')}${f('ing','Ingredients',p.ingredients,'textarea')}${f('st','Storage',p.storage,'textarea')}${f('hu','How to use (one step per line)',(p.howToUse||[]).join('\n'),'textarea')}
  <div class="two">${f('sl','Shelf life',p.shelfLife)}${f('pk','Pack sizes',p.pack)}${f('mrp','MRP (₹)',p.mrp)}${f('fs','FSSAI no. (blank = vendor’s)',p.fssai)}</div>${f('bn','Batch / extra note',p.batchNote)}
  <label style="font-weight:600"><input type="checkbox" id="ft" style="width:auto" ${p.featured?'checked':''}> Featured</label>
  <div style="display:flex;gap:10px;margin-top:22px"><button class="btn pri" id="sv">Save product</button><button class="btn ghost" id="cx">Cancel</button></div>`);
  $('#cx').onclick=close;
  $('#sv').onclick=async()=>{const body={id:p.id,name:$('#n').value,category:$('#c').value,tagline:$('#tg').value,description:$('#d').value,vendorId:$('#v').value,highlights:$('#h').value,ingredients:$('#ing').value,storage:$('#st').value,howToUse:$('#hu').value,shelfLife:$('#sl').value,pack:$('#pk').value,mrp:$('#mrp').value,fssai:$('#fs').value,batchNote:$('#bn').value,featured:$('#ft').checked,removeImage:$('#ri')?.checked};
   const file=$('#img').files[0];if(file){if(file.size>5e6)return toast('Image too large (max 5MB)');body.imageData=await shrink(file)}
   try{await api('/api/admin/products',{method:'POST',body});toast('Saved');close();load()}catch(e){toast(e.message)}};return}
 if(a=='newv'||a=='editv'){const v=db.vendors.find(x=>x.id==i)||{};
  modal(`<h2 style="color:var(--g8)">${i?'Edit':'Add'} vendor</h2>${f('vn','Vendor name *',v.name)}${f('va','Address',v.address,'textarea')}
  <div class="two">${f('vf','FSSAI number',v.fssai)}${f('ve','Established (year)',v.established)}${f('vi','Incorporation',v.incorporated)}${f('vp','Phone',v.phone)}</div>${f('vm','Email',v.email)}${f('vb','About vendor',v.about,'textarea')}
  <div style="display:flex;gap:10px;margin-top:22px"><button class="btn pri" id="sv">Save vendor</button><button class="btn ghost" id="cx">Cancel</button></div>`);
  $('#cx').onclick=close;
  $('#sv').onclick=async()=>{try{await api('/api/admin/vendors',{method:'POST',body:{id:v.id,name:$('#vn').value,address:$('#va').value,fssai:$('#vf').value,established:$('#ve').value,incorporated:$('#vi').value,phone:$('#vp').value,email:$('#vm').value,about:$('#vb').value}});toast('Saved');close();load()}catch(e){toast(e.message)}}}
}
const shrink=f=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=URL.createObjectURL(f)});
token?load():render();
</script></body></html>
